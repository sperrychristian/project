<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anglers Market - Sign Up</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" href="favicon.ico" />
  </head>
  <body>
    <!-- LOGO BAR -->
    <div id="logo-bar">
      <a href="index.html"><h1 id="site-name">Anglers Market</h1></a>
    </div>
    <!-- NAVIGATION -->
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="browse.html">Browse</a></li>
        <li><a href="how_it_works.html">How it works</a></li>
        <li><a href="sign_up.html">Sign up</a></li>
        <li><a href="login.html">Log in</a></li>
      </ul>
    </nav>

    <!-- BREADCRUMB -->
    <p class="breadcrumb"><a href="index.html">Home</a> &rsaquo; Sign up</p>

    <main>
      <div class="auth-wrapper">
        <h1>Create your account</h1>
        <p>Join Anglers Market to buy or sell custom flies and lures.</p>

        <form id="signup-form">
          <label for="name">Full name</label>
          <input type="text" id="name" name="name" required />

          <label for="email">Email address</label>
          <input type="email" id="email" name="email" required />

          <label for="password">Password</label>
          <input type="password" id="password" name="password" required />

          <label for="account-type">I am signing up as a</label>
          <select id="account-type" name="account-type">
            <option value="buyer">Buyer</option>
            <option value="seller">Seller</option>
          </select>

          <button type="submit" class="btn-primary">Sign up</button>
        </form>

        <p>Already have an account? <a href="login.html">Log in</a></p>
      </div>
    </main>

    <!-- FOOTER -->
    <footer>
      <p>&copy; 2026 Anglers Market. All rights reserved.</p>
    </footer>

    <!-- script to handle signup -->
    <script src="js/createaccount.js"></script>
  </body>
</html>
